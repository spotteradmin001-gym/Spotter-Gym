name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # No DB reads during the Phase 0 build. When db/** tests or
          # build-time queries land, add DATABASE_URL / DATABASE_URL_UNPOOLED
          # repo secrets (Neon preview branch) and pass them here.
          NEXT_TELEMETRY_DISABLED: "1"
